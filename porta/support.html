<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porta</title>
<script>
  var langs = ["en", "de", "fr", "it"];
  var pick = (navigator.languages || [navigator.language || "en"])
    .map(function (l) { return l.slice(0, 2).toLowerCase(); })
    .find(function (l) { return langs.indexOf(l) >= 0; }) || "en";
  location.replace(pick + "/support.html");
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/support.html"></noscript>
</head>
<body><p><a href="en/support.html">support</a></p></body>
</html>
